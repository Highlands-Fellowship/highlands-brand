<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 120">
  <!-- Dark combination mark: H circle + wordmark — for light backgrounds -->
  <!-- H mark circle -->
  <circle cx="60" cy="60" r="56" fill="#55b6b2"/>
  <g fill="#FFFFFF">
    <rect x="36" y="24" width="12" height="72" rx="3"/>
    <rect x="84" y="24" width="12" height="72" rx="3"/>
    <rect x="36" y="54" width="60" height="12" rx="3"/>
  </g>
  <!-- Wordmark -->
  <text x="140" y="50" font-family="Georgia, serif" font-size="38" font-weight="700"
        font-style="italic" fill="#0b1d41" letter-spacing="1">Highlands</text>
  <text x="140" y="78" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700"
        fill="#0b1d41" letter-spacing="7">FELLOWSHIP</text>
</svg>
