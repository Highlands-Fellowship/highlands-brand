<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Dark H mark: navy on white circle — for use on light backgrounds -->
  <circle cx="100" cy="100" r="96" fill="#FFFFFF" stroke="#E3E3E3" stroke-width="2"/>
  <!-- Stylized H letterform -->
  <g fill="#0b1d41">
    <rect x="56" y="52" width="20" height="96" rx="4"/>
    <rect x="124" y="52" width="20" height="96" rx="4"/>
    <rect x="56" y="90" width="88" height="20" rx="4"/>
  </g>
</svg>
